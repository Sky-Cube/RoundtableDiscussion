server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ai-panel-studio
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
  mvc:
    throw-exception-if-no-handler-found: true
    async:
      # SSE 长连接：默认一小时，客户端断开后由容器回收。
      request-timeout: 3600000
  web:
    resources:
      add-mappings: false

panel:
  db:
    # 业务库位置。相对路径按进程工作目录解析；allowed-root 之外一律拒绝。
    path: data/panel.db
    allowed-root: data
    # 根目录 init.sql 在构建时以 db/init.sql 放入 classpath，此处也支持 file:../init.sql。
    init-script: classpath:db/init.sql
    initialize: true
  gateway:
    mode: real
    base-url: ${PANEL_AI_BASE_URL:} # LLM API 基础 URL
    model: ${PANEL_AI_MODEL:} # LLM 模型
    api-key: ${PANEL_AI_API_KEY:} # LLM API 密钥
    template-directory: ${PANEL_AI_TEMPLATE_DIRECTORY:} # 自定义 Prompt 模板目录；留空使用包内 prompts/
    template-version: ${PANEL_AI_TEMPLATE_VERSION:v2.8} # 模板版本号，修改模板后同步更新，用于日志追踪
    context-window: ${PANEL_AI_CONTEXT_WINDOW:32768} # 模型上下文窗口，用于输入裁剪与调用预算
    evidence-enabled: ${PANEL_AI_EVIDENCE_ENABLED:true} # 是否允许专家在待机时后台查证复杂或前沿事实
    reasoning-effort: ${PANEL_AI_REASONING_EFFORT:low} # 快速思考强度；off 表示不发送该字段（DeepSeek 改走 thinking 开关）
    # 模型调用超时（秒）。慢模型或长输出可单独调大；非正数按默认值处理。
    timeouts:
      roster-seconds: ${PANEL_AI_TIMEOUT_ROSTER:50} # R01 阵容生成：一次输出完整 JSON，耗时最长
      utterance-seconds: ${PANEL_AI_TIMEOUT_UTTERANCE:35} # R02/R03/R05/R06 报名与短发言
      insight-seconds: ${PANEL_AI_TIMEOUT_INSIGHT:45} # R04 实时提炼：需核对全部实录和引文
      summary-seconds: ${PANEL_AI_TIMEOUT_SUMMARY:30} # R07 主持收尾：同时作为非总结任务的提前截止余量
      discussion-seconds: ${PANEL_AI_TIMEOUT_DISCUSSION:600} # 单场讨论总预算，耗尽后按有限收尾结束
      evidence-timeout-millis: ${PANEL_AI_EVIDENCE_TIMEOUT_MILLIS:${PANEL_AI_EVIDENCE_WAIT_MILLIS:12000}} # 后台查证总时限，0 表示关闭
  orchestration:
    # 同时执行的讨论数量、单场专家发言上限与相邻发言间隔（毫秒）。
    capacity: 2
    max-expert-utterances: 0
    stage-delay-millis: 0
  request:
    allowed-hosts:
      - 127.0.0.1
      - localhost
      - ::1
    allowed-origin-ports:
      - 5173
      - 5183
      - 8080

logging:
  file:
    name: logs/panel.log
  level:
    com.aipanel: INFO
    org.springframework.jdbc.core: WARN
